name: deploy-site

# Rebuilds and deploys the site from the current main, without the prediction pipeline. It reuses
# the site data (site-data artifact) of the newest daily-predictions run, so front-end changes
# go live in minutes. Changes to the exported data itself (publish, export-stats) still need a
# daily-predictions run.
on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Newest unexpired site-data artifact from a run of daily-predictions (the only workflow that
      # uploads one; kept 7 days). The artifact must come from this repository (not a fork's run
      # on a branch called main) and its run must be the scheduled or manual daily job on main.
      - name: Find the latest site data
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          run_id=$(gh api "repos/$REPO/actions/artifacts?name=site-data&per_page=20" \
            -q "[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == \"main\" and .workflow_run.head_repository_id == $REPO_ID)][0].workflow_run.id // empty")
          if [ -z "$run_id" ]; then
            echo "::error::no unexpired site-data artifact from this repository's main; run daily-predictions instead"
            exit 1
          fi
          run=$(gh api "repos/$REPO/actions/runs/$run_id" \
            -q '[.path, .event, (.head_repository.id | tostring), .head_branch] | join(" ")')
          if [ "$run" != ".github/workflows/daily.yml schedule $REPO_ID main" ] \
            && [ "$run" != ".github/workflows/daily.yml workflow_dispatch $REPO_ID main" ]; then
            echo "::error::run $run_id is not a daily-predictions run on main of this repository ($run)"
            exit 1
          fi
          echo "Using site data from run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      # the artifact's root is the paths' common ancestor, web/: it holds src/data/ and public/api/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-data
          path: web
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site (Astro, into site/)
        working-directory: web
        env:
          # Public by design (it ships in the browser bundle). Unset means Sentry stays off.
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
        run: |
          npm ci
          npm run build
      # F-03: the CSP is enforced, so an inline script whose hash is missing from the header would not run.
      # A stale hash fails the build here and the site is not deployed.
      - name: CSP hash drift
        run: python3 scripts/checks/csp_hashes.py site site/_headers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 1

  # Same as daily-predictions' deploy-page: the only job with Cloudflare credentials; it runs no
  # repo code, only the downloaded artifact and a pinned wrangler.
  deploy-page:
    needs: build-site
    # Defence in depth: the site is built from the dispatched branch's code, so only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the Cloudflare secrets live in this environment, which only main can deploy from
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      # Unknown URLs get the branded 404.html (not_found_handling "404-page"); the default "none" is an empty 404.
      # Written at the workspace root, outside site/, so the config itself is never served.
      - name: Write the Worker config
        run: |
          cat > wrangler.jsonc <<'EOF'
          {
            "name": "675hoops",
            "compatibility_date": "2026-10-01",
            "assets": { "directory": "site", "not_found_handling": "404-page" }
          }
          EOF
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: deploy
