name: deploy-site

# Rebuilds and deploys the site from the current main, without the prediction pipeline. It reuses
# the site data (site-data artifact) of the newest daily-predictions run, so front-end changes
# go live in minutes. Changes to the exported data itself (publish, export-stats) still need a
# daily-predictions run.
on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Newest unexpired site-data artifact built from main (only daily-predictions uploads one;
      # kept 7 days). Runs from other branches are skipped so they never reach production.
      - name: Find the latest site data
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id=$(gh api "repos/$REPO/actions/artifacts?name=site-data&per_page=20" \
            -q '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::no unexpired site-data artifact; run daily-predictions instead"
            exit 1
          fi
          echo "Using site data from run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      # the artifact's root is the paths' common ancestor, web/: it holds src/data/ and public/api/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-data
          path: web
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site (Astro, into site/)
        working-directory: web
        env:
          # Public by design (it ships in the browser bundle). Unset means Sentry stays off.
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 1

  # Same as daily-predictions' deploy-page: the only job with Cloudflare credentials; it runs no
  # repo code, only the downloaded artifact and a pinned wrangler.
  deploy-page:
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the Cloudflare secrets live in this environment, which only main can deploy from
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: deploy --assets site --name 675hoops --compatibility-date 2026-10-01
