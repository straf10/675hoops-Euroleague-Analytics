name: daily-predictions

on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      # Set by scripts/record_injuries.ps1 after the PC pushes a new injury snapshot: the odds call
      # and the people refresh (both once a day) are skipped, so the run makes no odds API call.
      injury_refresh:
        description: "Injury snapshot refresh (skips the odds and people steps)"
        type: boolean
        default: false

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  # Runs the pipeline and commits the logs. Its write token is used only in the push step: the
  # checkout keeps no credentials, and third-party npm code runs in build-site, which cannot write.
  predict:
    runs-on: ubuntu-latest
    # A cold raw cache (a few thousand throttled requests) fits well inside this.
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      # The team model (M1) needs box scores: keep the EuroLeague raw cache between runs too, so
      # only games finished since the last run are fetched (the first run fills 2023-24 on).
      # Restore and save are separate steps so a failed run still saves what it fetched.
      - name: Restore EuroLeague raw cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/euroleague
          key: euroleague-raw-${{ github.run_id }}
          restore-keys: euroleague-raw-
      - name: Ingest schedules and results
        run: |
          uv run --no-dev eurohoops ingest
      # Box scores of every default season (cached ones are never refetched).
      - name: Cache box scores for the team model
        run: |
          uv run --no-dev eurohoops ingest --details
      # Positions on the Players filter and player pages: the live season's people listing is
      # refetched once a day (one call; owner, Phase C) so new signings get one. A failure keeps
      # the cached listing and is only a warning.
      - name: Refresh the live season's people listing
        if: ${{ !inputs.injury_refresh }}
        run: |
          uv run --no-dev eurohoops people \
            || echo "::warning::people refresh failed; the cached listing stays"
      - name: Save EuroLeague raw cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/euroleague
          key: euroleague-raw-${{ github.run_id }}
      # M5 (EuroLeague shadow log) replays 2007-on games and needs the 2011-on stints mart, both
      # built from the seeded raw cache: past schedules and details are cache hits, so only the
      # live schedule is fetched. Elo and M1 slice their own seasons (replay_from), so the extra
      # marts rows do not move them. A failure is a warning: predict then skips M5 only.
      - name: Stage EuroLeague history for M5
        run: |
          uv run --no-dev eurohoops ingest --from-season 2007 \
            || echo "::warning::EuroLeague history staging failed; M5 will be skipped"
      - name: Build marts
        run: uv run --no-dev eurohoops build
      # The mart is for M5 only: its report (the historical validation the M1 card quotes) is
      # put back, so the daily commit never moves it.
      - name: Build the stints mart for M5
        run: |
          uv run --no-dev eurohoops stints --mart \
            || echo "::warning::stints mart failed; M5 will be skipped"
          git checkout -- reports/stints_mart.json
      # Market benchmark (EuroLeague only): one The Odds API call. The repository secret is
      # set by the owner; without it the step is skipped with a warning, never failed.
      - name: Record EuroLeague odds
        if: ${{ !inputs.injury_refresh }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY secret is not set; skipping the odds recorder"
          else
            uv run --no-dev eurohoops odds
          fi
      # Injury log is written on the owner's PC (BasketNews blocks runner IPs). CI only probes.
      - name: Record EuroLeague injuries
        run: |
          out=$(uv run --no-dev eurohoops injuries --probe) || true
          echo "$out"
          case "$out" in
            *"injuries: probe ok"*) ;;
            *) echo "::warning::injury report not recorded (see log)" ;;
          esac
      - name: Predict upcoming games
        run: uv run --no-dev eurohoops predict
      - name: Score the live logs
        run: uv run --no-dev eurohoops score
      # Live M6 (its gate passed, weeks 16-18 L-l): the 2026-27 projections, from the committed
      # crosswalk (entity/player_xwalk.csv). They change
      # only at a checkpoint (25/50/75% of the rounds). The board and the comparables need the
      # local M2 shot marts and stay as committed. A failure is a warning: the pages keep the
      # last committed report.
      - name: Project players (M6)
        run: |
          uv run --no-dev eurohoops project --projections-only \
            || echo "::warning::M6 projections failed; the committed report stays"
      # Live M7: gate v2 passed (docs/models/m7.md, PLAN 8.1 R5), so the EuroLeague run is appended
      # to the pre-registered log predictions/euroleague_sim_2026-27.csv once per completed round.
      # A failure is a warning, as for M6.
      - name: Season simulation log (M7, EuroLeague)
        run: |
          uv run --no-dev eurohoops simulate || echo "::warning::M7 simulation failed; no row logged"
      # The Standings page (owner, weeks 16-18 D1): M7's run, rewritten only after a newly
      # completed round; labelled gated.
      - name: Standings season simulation
        run: uv run --no-dev eurohoops sim-ungated
      # export-stats fails on a validation error (a published season with no games, or a schema
      # break): the site is then not rebuilt, but the day's logs below are still committed.
      - name: Export the site data
        id: export
        run: |
          uv run --no-dev eurohoops publish
          uv run --no-dev eurohoops export-stats --from-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-data
          path: |
            web/src/data/site.json
            web/src/data/stats/
            web/src/data/api/
            web/public/api/
            web/public/downloads/
          if-no-files-found: error
          retention-days: 7
      # Rule 1 (CLAUDE.md): the logs only grow. Fails the run before anything is committed if a row
      # of the checked-out commit was edited or removed, or a log file vanished.
      - name: Check the logs are append-only
        if: success() || steps.export.outcome == 'failure'
        run: uv run --no-dev python scripts/checks/append_only.py HEAD
      # main may have moved during the run: replay the run's commit on top of it. A conflict (an
      # append-only log changed on both sides) is never resolved here: abort, fail, merge by hand.
      - name: Commit predictions and reports if changed
        if: success() || steps.export.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git add predictions/ reports/ odds/
          # M5-INJ's log (docs/models/m5_inj.md): named explicitly; written once M5INJ_LIVE_ENABLED is on.
          if [ -f predictions/euroleague_m5inj_2026-27.csv ]; then git add predictions/euroleague_m5inj_2026-27.csv; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily predictions $(date -u +%Y-%m-%dT%H:%MZ)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if ! git pull --rebase "$remote" "$BRANCH"; then
            git rebase --abort 2>/dev/null || true  # no rebase to abort if the pull itself failed
            echo "::error::could not replay onto $BRANCH (conflict or fetch failure); nothing pushed, merge by hand"
            exit 1
          fi
          if ! out=$(git push "$remote" "HEAD:$BRANCH" 2>&1); then
            echo "$out"
            # One retry, and only when the remote moved after our replay. Never forced; a second rejection fails the job.
            if ! grep -qE 'rejected|fetch first|non-fast-forward' <<<"$out"; then exit 1; fi
            echo "::warning::$BRANCH moved during the run; replaying once more"
            if ! git pull --rebase "$remote" "$BRANCH"; then
              git rebase --abort 2>/dev/null || true
              echo "::error::could not replay onto $BRANCH on retry (conflict or fetch failure); nothing pushed, merge by hand"
              exit 1
            fi
            git push "$remote" "HEAD:$BRANCH"
          else
            echo "$out"
          fi

  build-site:
    needs: predict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the artifact's root is the paths' common ancestor, web/: it holds src/data/ and public/api/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-data
          path: web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site (Astro, into site/)
        working-directory: web
        env:
          # Public by design (it ships in the browser bundle). Unset means Sentry stays off.
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
        run: |
          npm ci
          npm run build
      # F-03: the CSP is enforced, so an inline script whose hash is missing from the header would not run.
      # A stale hash fails the build here and the site is not deployed.
      - name: CSP hash drift
        run: python3 scripts/checks/csp_hashes.py site site/_headers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site

  # Uploads the built site to the 675hoops Cloudflare Worker (static assets). Holds the only
  # Cloudflare credentials; it runs no repo code, only the downloaded artifact and a pinned wrangler.
  deploy-page:
    needs: build-site
    # Defence in depth: the site is built from the dispatched branch's code, so only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the Cloudflare secrets live in this environment, which only main can deploy from
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: deploy --assets site --name 675hoops --compatibility-date 2026-10-01
