name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static checks. Runs in parallel with `test`, and independently of it, so the dead-code check
  # reports even when a test fails.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Dead code
        run: uv run vulture src scripts/vulture_whitelist.py --min-confidence 60

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      # The tests marked slow (the M5/M6 leakage and backtest files, half the suite's time) run on
      # pull requests, the nightly schedule, manual runs and any push that touches the code they
      # guard. Other pushes run the rest; the coverage gate is measured on full runs only, since
      # the fast set alone covers less by design.
      - name: Choose the test set
        id: tests
        env:
          BEFORE: ${{ github.event.before }}
          GUARDED: >-
            ^(src/eurohoops/(eval|models|parse)/|src/eurohoops/config\.py|pyproject\.toml|uv\.lock|tests/(conftest|m5_synthetic|m6_synthetic)\.py|tests/test_m[56]_(leakage|backtest)\.py)
        run: |
          full=true
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD | grep -qE "$GUARDED" || full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "full test suite: $full"
      - name: Tests (full)
        if: steps.tests.outputs.full == 'true'
        run: uv run pytest -q -n auto --dist loadfile --cov=eurohoops --cov-fail-under=85
      - name: Tests (fast, slow-marked skipped)
        if: steps.tests.outputs.full != 'true'
        run: uv run pytest -q -n auto --dist loadfile -m "not slow"

  # Single status for branch protection that used to be the `check` job. It runs even when a
  # needed job fails, and passes only if both lint and test succeeded.
  check:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint and test to pass
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT, test: $TEST"
          [ "$LINT" = success ] && [ "$TEST" = success ]

  # Builds the Astro site from the committed fixtures (tests/fixtures/site.json and stats/, kept
  # in step with the real schema by tests/test_site_fixture.py and tests/test_stats.py), so a
  # broken page fails here and not in the daily run.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use the site data fixtures
        run: |
          cp tests/fixtures/site.json web/src/data/site.json
          cp -r tests/fixtures/stats web/src/data/stats
      - name: TS unit tests
        working-directory: web
        run: node --test "src/lib/**/*.test.ts" "scripts/*.test.mjs"
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run build
