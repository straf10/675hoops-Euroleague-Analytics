<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="460" height="270" role="img" aria-labelledby="elo-curve-title elo-curve-desc"><title id="elo-curve-title">Elo win probability curve</title><desc id="elo-curve-desc">Logistic curve of home-win probability against the rating gap; equal teams give the home side 0.627 from the 90-point home-court advantage.</desc><style>svg{--paper:#f9f9f7;--surface:#fcfcfb;--sunk:#f1f1ee;--ink:#111110;--ink-soft:#52514e;--muted:#6d6b66;--axis:#898781;--rule:#e1e0d9;--rule-strong:#c3c2b7;--accent:#d9590b;--accent-tint:rgba(217,89,11,.09);--base:#8f8d86;--blue:#2a78d6;--blue-tint:rgba(42,120,214,.10)} svg .mask{fill:var(--paper)}
svg .lmask{fill:var(--paper)}
svg .node .body{stroke-width:1}
svg .n-step .body{fill:var(--surface);stroke:var(--ink)}
svg .n-focal .body{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.4}
svg .n-store .body{fill:var(--sunk);stroke:var(--muted)}
svg .n-input .body{fill:var(--surface);stroke:var(--axis)}
svg .n-ext .body{fill:var(--paper);stroke:var(--rule-strong)}
svg .n-shadow .body{fill:var(--surface);stroke:var(--ink-soft);stroke-dasharray:4 3}
svg .n-base .body{fill:var(--sunk);stroke:var(--base)}
svg .tag{fill:none;stroke:var(--rule-strong);stroke-width:.8}
svg .n-focal .tag{stroke:var(--accent)}
svg text{font-family:'Geist','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
svg .t-name{font-size:12.5px;font-weight:600;fill:var(--ink)}
