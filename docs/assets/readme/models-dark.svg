<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="models-title models-desc"><title id="models-title">The model family</title><desc id="models-desc">Dependency map of the forecasting models: Elo is the published forecast; ELOR builds on Elo and M3; M5 builds on M3 and M1; M7 simulates seasons from M1; M5-INJ adjusts M5 for injuries; POOL averages four logs; B0 is the baseline.</desc><style>svg{--paper:#0e0e0d;--surface:#1a1a19;--sunk:#1c1c1b;--ink:#f2f1ec;--ink-soft:#c3c2b7;--muted:#9c9a92;--axis:#7d7b74;--rule:#2c2c2a;--rule-strong:#45453f;--accent:#e2691f;--accent-tint:rgba(226,105,31,.15);--base:#6a6862;--blue:#3987e5;--blue-tint:rgba(57,135,229,.16)} svg .mask{fill:var(--paper)}
svg .lmask{fill:var(--paper)}
svg .node .body{stroke-width:1}
svg .n-step .body{fill:var(--surface);stroke:var(--ink)}
svg .n-focal .body{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.4}
svg .n-store .body{fill:var(--sunk);stroke:var(--muted)}
svg .n-input .body{fill:var(--surface);stroke:var(--axis)}
svg .n-ext .body{fill:var(--paper);stroke:var(--rule-strong)}
svg .n-shadow .body{fill:var(--surface);stroke:var(--ink-soft);stroke-dasharray:4 3}
svg .n-base .body{fill:var(--sunk);stroke:var(--base)}
svg .tag{fill:none;stroke:var(--rule-strong);stroke-width:.8}
svg .n-focal .tag{stroke:var(--accent)}
svg text{font-family:'Geist','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
svg .t-name{font-size:12.5px;font-weight:600;fill:var(--ink)}
svg .t-sub{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9.5px;fill:var(--ink-soft)}
svg .t-tag{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:7.5px;letter-spacing:.06em;fill:var(--muted)}
svg .n-focal .t-tag{fill:var(--accent)}
svg .t-eyebrow{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.14em;fill:var(--muted)}
svg .t-eyebrow-accent{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.14em;fill:var(--accent);font-weight:600}
svg .t-label{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;letter-spacing:.06em;fill:var(--muted)}
svg .t-aside{font-size:11px;font-style:italic;fill:var(--muted)}
svg .t-axis{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9.5px;fill:var(--muted)}
svg .t-axislab{font-size:11px;fill:var(--ink-soft)}
svg .t-rowname{font-size:12px;font-weight:500;fill:var(--ink)}
svg .t-serieslab{font-size:11px;font-weight:600;fill:var(--ink)}
svg .t-serieslab-blue{font-size:11px;font-weight:600;fill:var(--blue)}
svg .t-serieslab-accent{font-size:11px;font-weight:600;fill:var(--accent)}
svg .t-serieslab-muted{font-size:11px;font-weight:600;fill:var(--muted)}
svg .c{fill:none;stroke:var(--muted);stroke-width:1.1}
svg .c-accent{fill:none;stroke:var(--accent);stroke-width:1.3}
svg .dash{stroke-dasharray:5 4}
svg .mk{fill:var(--muted)} svg .mk-accent{fill:var(--accent)} svg .mk-blue{fill:var(--blue)}
svg .hair{stroke:var(--rule);stroke-width:.8}
svg .grid{stroke:var(--rule);stroke-width:.8}
svg .axis{stroke:var(--rule-strong);stroke-width:1}
svg .guide{stroke:var(--axis);stroke-width:.9;stroke-dasharray:3 3;fill:none}
svg .zero{stroke:var(--ink);stroke-width:1}
svg .line-ink{fill:none;stroke:var(--ink);stroke-width:1.8}
svg .line-blue{fill:none;stroke:var(--blue);stroke-width:1.8}
svg .line-accent{fill:none;stroke:var(--accent);stroke-width:1.8}
svg .line-muted{fill:none;stroke:var(--muted);stroke-width:1.6}
svg .area-accent{fill:var(--accent-tint);stroke:none}
svg .dot-accent{fill:var(--accent)} svg .dot-ink{fill:var(--ink)} svg .dot-muted{fill:var(--paper);stroke:var(--muted);stroke-width:1.4}
svg .tip{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3}
svg .tip-accent{stroke:var(--accent)}
svg .window{fill:var(--blue-tint);stroke:var(--blue);stroke-width:.8}
svg .diamond{fill:var(--surface);stroke:var(--ink);stroke-width:1}
svg .seg{stroke-width:1}
svg .seg-warm,svg .sw-warm .body{fill:var(--sunk);stroke:var(--rule-strong)}
svg .seg-tune,svg .sw-tune .body{fill:var(--base);stroke:var(--base)}
svg .seg-fold,svg .sw-fold .body{fill:var(--base);stroke:var(--base)}
svg .seg-val,svg .sw-val .body{fill:var(--blue);stroke:var(--blue)}
svg .seg-test,svg .sw-test .body{fill:var(--ink);stroke:var(--ink)}
svg .seg-live,svg .sw-live .body{fill:var(--accent);stroke:var(--accent)}
svg .foldtick{stroke:var(--paper);stroke-width:1.5}</style><rect width="100%" height="100%" rx="8" style="fill:var(--paper)"/><defs>
