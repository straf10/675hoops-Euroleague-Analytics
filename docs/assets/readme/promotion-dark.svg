<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="promotion-title promotion-desc"><title id="promotion-title">How a model gets promoted</title><desc id="promotion-desc">Flow from writing the pass bar, through the walk-forward backtest and the live shadow log, to the checkpoint bootstrap test that decides whether a shadow model replaces Elo.</desc><style>svg{--paper:#0e0e0d;--surface:#1a1a19;--sunk:#1c1c1b;--ink:#f2f1ec;--ink-soft:#c3c2b7;--muted:#9c9a92;--axis:#7d7b74;--rule:#2c2c2a;--rule-strong:#45453f;--accent:#e2691f;--accent-tint:rgba(226,105,31,.15);--base:#6a6862;--blue:#3987e5;--blue-tint:rgba(57,135,229,.16)} svg .mask{fill:var(--paper)}
svg .lmask{fill:var(--paper)}
svg .node .body{stroke-width:1}
svg .n-step .body{fill:var(--surface);stroke:var(--ink)}
svg .n-focal .body{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.4}
svg .n-store .body{fill:var(--sunk);stroke:var(--muted)}
svg .n-input .body{fill:var(--surface);stroke:var(--axis)}
svg .n-ext .body{fill:var(--paper);stroke:var(--rule-strong)}
svg .n-shadow .body{fill:var(--surface);stroke:var(--ink-soft);stroke-dasharray:4 3}
svg .n-base .body{fill:var(--sunk);stroke:var(--base)}
svg .tag{fill:none;stroke:var(--rule-strong);stroke-width:.8}
svg .n-focal .tag{stroke:var(--accent)}
svg text{font-family:'Geist','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
svg .t-name{font-size:12.5px;font-weight:600;fill:var(--ink)}
svg .t-sub{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9.5px;fill:var(--ink-soft)}
svg .t-tag{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:7.5px;letter-spacing:.06em;fill:var(--muted)}
svg .n-focal .t-tag{fill:var(--accent)}
svg .t-eyebrow{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.14em;fill:var(--muted)}
svg .t-eyebrow-accent{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.14em;fill:var(--accent);font-weight:600}
svg .t-label{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;letter-spacing:.06em;fill:var(--muted)}
svg .t-aside{font-size:11px;font-style:italic;fill:var(--muted)}
svg .t-axis{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9.5px;fill:var(--muted)}
svg .t-axislab{font-size:11px;fill:var(--ink-soft)}
svg .t-rowname{font-size:12px;font-weight:500;fill:var(--ink)}
svg .t-serieslab{font-size:11px;font-weight:600;fill:var(--ink)}
svg .t-serieslab-blue{font-size:11px;font-weight:600;fill:var(--blue)}
svg .t-serieslab-accent{font-size:11px;font-weight:600;fill:var(--accent)}
svg .t-serieslab-muted{font-size:11px;font-weight:600;fill:var(--muted)}
svg .c{fill:none;stroke:var(--muted);stroke-width:1.1}
svg .c-accent{fill:none;stroke:var(--accent);stroke-width:1.3}
svg .dash{stroke-dasharray:5 4}
svg .mk{fill:var(--muted)} svg .mk-accent{fill:var(--accent)} svg .mk-blue{fill:var(--blue)}
svg .hair{stroke:var(--rule);stroke-width:.8}
svg .grid{stroke:var(--rule);stroke-width:.8}
svg .axis{stroke:var(--rule-strong);stroke-width:1}
svg .guide{stroke:var(--axis);stroke-width:.9;stroke-dasharray:3 3;fill:none}
svg .zero{stroke:var(--ink);stroke-width:1}
svg .line-ink{fill:none;stroke:var(--ink);stroke-width:1.8}
svg .line-blue{fill:none;stroke:var(--blue);stroke-width:1.8}
svg .line-accent{fill:none;stroke:var(--accent);stroke-width:1.8}
svg .line-muted{fill:none;stroke:var(--muted);stroke-width:1.6}
svg .area-accent{fill:var(--accent-tint);stroke:none}
svg .dot-accent{fill:var(--accent)} svg .dot-ink{fill:var(--ink)} svg .dot-muted{fill:var(--paper);stroke:var(--muted);stroke-width:1.4}
svg .tip{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3}
svg .tip-accent{stroke:var(--accent)}
svg .window{fill:var(--blue-tint);stroke:var(--blue);stroke-width:.8}
svg .diamond{fill:var(--surface);stroke:var(--ink);stroke-width:1}
svg .seg{stroke-width:1}
svg .seg-warm,svg .sw-warm .body{fill:var(--sunk);stroke:var(--rule-strong)}
svg .seg-tune,svg .sw-tune .body{fill:var(--base);stroke:var(--base)}
svg .seg-fold,svg .sw-fold .body{fill:var(--base);stroke:var(--base)}
svg .seg-val,svg .sw-val .body{fill:var(--blue);stroke:var(--blue)}
svg .seg-test,svg .sw-test .body{fill:var(--ink);stroke:var(--ink)}
svg .seg-live,svg .sw-live .body{fill:var(--accent);stroke:var(--accent)}
svg .foldtick{stroke:var(--paper);stroke-width:1.5}</style><rect width="100%" height="100%" rx="8" style="fill:var(--paper)"/><defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk" points="0 0, 8 3, 0 6"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk-accent" points="0 0, 8 3, 0 6"/></marker>
<marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk-blue" points="0 0, 8 3, 0 6"/></marker>
</defs><path class="c" d="M180,76.0 L218,76.0" marker-end="url(#arrow)"/>
<path class="c" d="M380,76.0 L418,76.0" marker-end="url(#arrow)"/>
<path class="c" d="M580,76.0 L618,76.0" marker-end="url(#arrow)"/>
<path class="c" d="M780,76.0 L818,76.0" marker-end="url(#arrow)"/>
<path class="c" d="M300,112 L300,236" marker-end="url(#arrow)"/>
<rect class="lmask" x="312.0" y="163" width="64.0" height="12" rx="2"/><text x="344" y="172" class="t-label" text-anchor="middle" >BAR MISSED</text>
<path class="c" d="M900,112 L900,176" marker-end="url(#arrow)"/>
<path class="c-accent" d="M900,256 L900,286" marker-end="url(#arrow-accent)"/>
<rect class="lmask" x="914.9" y="265" width="26.2" height="12" rx="2"/><text x="928" y="274" class="t-label" text-anchor="middle" >YES</text>
<path class="c dash" d="M828,216 L708.0,216.0 Q700,216 700.0,208.0 L700,114" marker-end="url(#arrow)"/>
<rect class="lmask" x="737.4" y="197" width="53.2" height="12" rx="2"/><text x="764" y="206" class="t-label" text-anchor="middle" >NO: WAIT</text>
<g class="node n-step">
<rect class="mask" x="20" y="40" width="160" height="72" rx="6"/>
<rect class="body" x="20" y="40" width="160" height="72" rx="6"/>
<text x="100.0" y="66.0" class="t-name" text-anchor="middle" >Write the pass bar</text>
<text x="100.0" y="81.0" class="t-sub" text-anchor="middle" >experiments/&lt;id&gt;.md</text>
<text x="100.0" y="94.0" class="t-sub" text-anchor="middle" >committed first</text>
</g>
<g class="node n-step">
<rect class="mask" x="220" y="40" width="160" height="72" rx="6"/>
<rect class="body" x="220" y="40" width="160" height="72" rx="6"/>
<text x="300.0" y="66.0" class="t-name" text-anchor="middle" >Walk-forward backtest</text>
<text x="300.0" y="81.0" class="t-sub" text-anchor="middle" >vs the baseline</text>
<text x="300.0" y="94.0" class="t-sub" text-anchor="middle" >on unseen seasons</text>
</g>
<g class="node n-shadow">
<rect class="mask" x="420" y="40" width="160" height="72" rx="6"/>
<rect class="body" x="420" y="40" width="160" height="72" rx="6"/>
<text x="500.0" y="66.0" class="t-name" text-anchor="middle" >Live shadow log</text>
<text x="500.0" y="81.0" class="t-sub" text-anchor="middle" >predictions/&lt;comp&gt;_&lt;id&gt;</text>
<text x="500.0" y="94.0" class="t-sub" text-anchor="middle" >logged every day</text>
</g>
<g class="node n-step">
<rect class="mask" x="620" y="40" width="160" height="72" rx="6"/>
<rect class="body" x="620" y="40" width="160" height="72" rx="6"/>
<text x="700.0" y="66.0" class="t-name" text-anchor="middle" >Checkpoint</text>
<text x="700.0" y="81.0" class="t-sub" text-anchor="middle" >EL: round 19 · end</text>
<text x="700.0" y="94.0" class="t-sub" text-anchor="middle" ></text>
</g>
<g class="node n-step">
<rect class="mask" x="820" y="40" width="160" height="72" rx="6"/>
<rect class="body" x="820" y="40" width="160" height="72" rx="6"/>
<text x="900.0" y="66.0" class="t-name" text-anchor="middle" >Paired bootstrap</text>
<text x="900.0" y="81.0" class="t-sub" text-anchor="middle" >10,000 resamples</text>
<text x="900.0" y="94.0" class="t-sub" text-anchor="middle" >common games only</text>
</g>
<g class="node n-base">
<rect class="mask" x="220" y="236" width="160" height="64" rx="6"/>
<rect class="body" x="220" y="236" width="160" height="64" rx="6"/>
<text x="300.0" y="258.0" class="t-name" text-anchor="middle" >Stop</text>
<text x="300.0" y="273.0" class="t-sub" text-anchor="middle" >result recorded</text>
<text x="300.0" y="286.0" class="t-sub" text-anchor="middle" >spec merged alone</text>
</g>
<polygon class="diamond" points="900,176 972,216 900,256 828,216"/>
<text x="900" y="212" class="t-name" text-anchor="middle" >CI upper &lt; 0</text>
<text x="900" y="228" class="t-sub" text-anchor="middle" >and mean ≤ −0.01</text>
<g class="node n-focal">
<rect class="mask" x="820" y="288" width="160" height="64" rx="6"/>
<rect class="body" x="820" y="288" width="160" height="64" rx="6"/>
<text x="900.0" y="310.0" class="t-name" text-anchor="middle" >Promoted</text>
<text x="900.0" y="325.0" class="t-sub" text-anchor="middle" >replaces Elo on</text>
<text x="900.0" y="338.0" class="t-sub" text-anchor="middle" >the site</text>
</g></svg>