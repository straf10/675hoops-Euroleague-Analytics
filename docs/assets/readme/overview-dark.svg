<rect class="lmask" x="586.0" y="127" width="64.0" height="12" rx="2"/><text x="618" y="136" class="t-label" text-anchor="middle" >PARAMETERS</text>
<path class="c" d="M844,240 L844,318" marker-end="url(#arrow)"/>
<path class="c-accent dash" d="M908,350 L988.0,350.0 Q996,350 996.0,342.0 L996,242" marker-end="url(#arrow-accent)"/>
<rect class="lmask" x="914.0" y="331" width="64.0" height="12" rx="2"/><text x="946" y="340" class="t-label" text-anchor="middle" >SWAP MODEL</text>
