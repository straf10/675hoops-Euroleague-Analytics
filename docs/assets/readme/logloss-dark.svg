<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="logloss-title logloss-desc"><title id="logloss-title">Log loss penalty</title><desc id="logloss-desc">Log loss for one game as a function of the forecast: small when the forecast leaned the right way, and rising without limit as a confident forecast turns out wrong.</desc><style>svg{--paper:#0e0e0d;--surface:#1a1a19;--sunk:#1c1c1b;--ink:#f2f1ec;--ink-soft:#c3c2b7;--muted:#9c9a92;--axis:#7d7b74;--rule:#2c2c2a;--rule-strong:#45453f;--accent:#e2691f;--accent-tint:rgba(226,105,31,.15);--base:#6a6862;--blue:#3987e5;--blue-tint:rgba(57,135,229,.16)} svg .mask{fill:var(--paper)}
svg .lmask{fill:var(--paper)}
svg .node .body{stroke-width:1}
svg .n-step .body{fill:var(--surface);stroke:var(--ink)}
svg .n-focal .body{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.4}
